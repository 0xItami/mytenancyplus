name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests
      - run: pytest --cov=app --cov-report=xml --cov-fail-under=70

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mytenancyplus
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mytenancyplus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MTP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mytenancyplus
      MTP_INTEGRATION_ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mytenancyplus
      MTP_INTEGRATION_APP_DATABASE_URL: postgresql+asyncpg://mytenancyplus:mytenancyplus@localhost:5432/mytenancyplus
      MTP_JWT_SECRET: integration-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -m integration tests/test_postgres_rls_integration.py

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: mytenancyplus:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: web
          push: false
          tags: mytenancyplus-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
